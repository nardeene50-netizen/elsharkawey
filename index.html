<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كبده ومخ الشرقاوي - نظام الإدارة</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans p-6">

    <!-- شاشة تسجيل الدخول -->
    <div id="loginScreen" class="max-w-md mx-auto bg-white p-8 rounded-lg shadow-lg mt-20">
        <h1 class="text-2xl font-bold text-center text-red-700 mb-6">تسجيل دخول مطعم الشرقاوي 🥩</h1>
        <div class="mb-4">
            <label class="block text-gray-700 mb-2 font-bold">اسم المستخدم</label>
            <input type="text" id="username" placeholder="اكتب اسم المستخدم" class="w-full p-3 border rounded">
        </div>
        <div class="mb-6">
            <label class="block text-gray-700 mb-2 font-bold">كلمة المرور</label>
            <input type="password" id="password" placeholder="اكتب كلمة المرور" class="w-full p-3 border rounded">
        </div>
        <button onclick="handleLogin()" class="w-full bg-red-600 text-white p-3 rounded font-bold hover:bg-red-700">دخول للسيستم</button>
        <p id="loginError" class="text-red-500 text-center mt-3 text-sm hidden">اسم المستخدم أو كلمة المرور غير صحيحة!</p>
    </div>

    <!-- لوحة التحكم والسيستم (مخفية لحين تسجيل الدخول) -->
    <div id="appScreen" class="max-w-4xl mx-auto bg-white p-6 rounded-lg shadow-lg hidden">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-3xl font-bold text-red-700">مطعم كبده ومخ الشرقاوي 🥩🧠</h1>
            <button onclick="handleLogout()" class="bg-gray-300 text-gray-800 px-4 py-2 rounded font-bold hover:bg-gray-400">تسجيل خروج</button>
        </div>
        
        <!-- قسم إضافة طلب جديد -->
        <div class="bg-gray-50 p-4 rounded mb-6 border">
            <h2 class="text-xl font-bold mb-3 text-gray-800">إضافة طلب جديد</h2>
            <input type="text" id="customerName" placeholder="اسم العميل أو رقم الطاولة" class="w-full p-2 border rounded mb-3">
            <textarea id="orderDetails" placeholder="تفاصيل الطلب (مثلاً: 2 سندوتش كبدة، 1 مخ)" class="w-full p-2 border rounded mb-3"></textarea>
            <input type="number" id="totalPrice" placeholder="الإجمالي (جنيه)" class="w-full p-2 border rounded mb-3">
            <button onclick="addOrder()" class="w-full bg-green-600 text-white p-2 rounded font-bold hover:bg-green-700">حفظ وإرسال الطلب</button>
        </div>

        <!-- قسم عرض الطلبات الحالية -->
        <div>
            <h2 class="text-xl font-bold mb-3 text-gray-800">الطلبات الحالية</h2>
            <div id="ordersList" class="space-y-3">
                <p class="text-gray-500">جاري تحميل الطلبات...</p>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://lgwpqauwpzyvnyozkskn.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_lVZCBA_yIAQUM_H3_VCDkw_TpLOo8nK';
        
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // بيانات الدخول الخاصة بالمطعم
        const ADMIN_USER = "elsharkawey";
        const ADMIN_PASS = "123456";

        function handleLogin() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const errorMsg = document.getElementById('loginError');

            if (user === ADMIN_USER && pass === ADMIN_PASS) {
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('appScreen').classList.remove('hidden');
                fetchOrders();
            } else {
                errorMsg.classList.remove('hidden');
            }
        }

        function handleLogout() {
            document.getElementById('appScreen').classList.add('hidden');
            document.getElementById('loginScreen').classList.remove('hidden');
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
        }

        async function fetchOrders() {
            const { data, error } = await _supabase.from('orders').select('*').order('id', { ascending: false });
            const listDiv = document.getElementById('ordersList');
            if (error) {
                console.error(error);
                listDiv.innerHTML = '<p class="text-red-500">خطأ في جلب الطلبات</p>';
                return;
            }
            if (!data || data.length === 0) {
                listDiv.innerHTML = '<p class="text-gray-500">لا توجد طلبات حالياً</p>';
                return;
            }
            listDiv.innerHTML = data.map(o => {
                let itemsText = typeof o.items === 'string' ? o.items : JSON.stringify(o.items);
                return `
                <div class="p-3 border rounded bg-white shadow-sm flex justify-between items-center">
                    <div>
                        <strong>العميل/الطاولة:</strong> ${o.customer_name || 'بدون اسم'} <br>
                        <strong>الطلب:</strong> ${itemsText} <br>
                        <strong>الإجمالي:</strong> ${o.total_price} جنيه
                    </div>
                    <span class="bg-yellow-100 text-yellow-800 px-3 py-1 rounded font-bold text-sm">${o.status || 'جديد'}</span>
                </div>
            `}).join('');
        }

        async function addOrder() {
            const customer_name = document.getElementById('customerName').value;
            const itemsText = document.getElementById('orderDetails').value;
            const total_price = parseFloat(document.getElementById('totalPrice').value);

            if (!itemsText || !total_price) {
                alert('من فضلك اكتب تفاصيل الطلب والإجمالي');
                return;
            }

            const itemsData = JSON.stringify(itemsText);

            const { error } = await _supabase.from('orders').insert([{ 
                customer_name: customer_name, 
                items: itemsData, 
                total_price: total_price 
            }]);

            if (error) {
                console.error(error);
                alert('حدث خطأ أثناء حفظ الطلب: ' + error.message);
            } else {
                document.getElementById('customerName').value = '';
                document.getElementById('orderDetails').value = '';
                document.getElementById('totalPrice').value = '';
                fetchOrders();
            }
        }
    </script>
</body>
</html>
