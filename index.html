<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مطعم كبده ومخ الشرقاوي - كاشير</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @media print {
            body * { visibility: hidden; }
            #printArea, #printArea * { visibility: visible; }
            #printArea { position: absolute; left: 0; top: 0; width: 100%; }
        }
        .tab-btn.active {
            background-color: #dc2626;
            color: white;
            border-color: #dc2626;
        }
    </style>
</head>
<body class="bg-gray-100 font-sans p-3">

    <!-- شاشة تسجيل الدخول -->
    <div id="loginScreen" class="max-w-md mx-auto bg-white p-8 rounded-lg shadow-lg mt-20">
        <h1 class="text-2xl font-bold text-center text-red-700 mb-6">تسجيل دخول كاشير الشرقاوي 🥩</h1>
        <div class="mb-4">
            <label class="block text-gray-700 mb-2 font-bold">اسم المستخدم</label>
            <input type="text" id="username" placeholder="اسم المستخدم" class="w-full p-3 border rounded">
        </div>
        <div class="mb-6">
            <label class="block text-gray-700 mb-2 font-bold">كلمة المرور</label>
            <input type="password" id="password" placeholder="كلمة المرور" class="w-full p-3 border rounded">
        </div>
        <button onclick="handleLogin()" class="w-full bg-red-600 text-white p-3 rounded font-bold hover:bg-red-700">دخول للسيستم</button>
        <p id="loginError" class="text-red-500 text-center mt-3 text-sm hidden">بيانات الدخول غير صحيحة!</p>
    </div>

    <!-- شاشة نظام الكاشير والطلبات -->
    <div id="appScreen" class="max-w-7xl mx-auto bg-white p-4 rounded-lg shadow-lg hidden">
        <!-- شريط علوي -->
        <div class="flex justify-between items-center mb-4 border-b pb-3">
            <h1 class="text-2xl font-bold text-red-700">مطعم كبده ومخ الشرقاوي 🥩🧠</h1>
            <div class="flex items-center gap-3">
                <button onclick="showSalesReport()" class="bg-blue-600 text-white px-3 py-1.5 rounded font-bold hover:bg-blue-700 text-sm">📊 تقرير المبيعات</button>
                <button onclick="handleLogout()" class="bg-gray-300 text-gray-800 px-3 py-1.5 rounded font-bold hover:bg-gray-400 text-sm">خروج</button>
            </div>
        </div>
        
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-4">
            
            <!-- قسم المنيو والأقسام (8 أعمدة) -->
            <div class="lg:col-span-7 bg-gray-50 p-3 rounded border">
                <!-- أزرار الأقسام الرئيسية -->
                <div class="flex gap-1 overflow-x-auto pb-2 mb-3 border-b text-sm font-bold">
                    <button onclick="switchTab('sandwiches')" id="tab-sandwiches" class="tab-btn active px-3 py-2 rounded bg-white border whitespace-nowrap">🥪 سندوتشات</button>
                    <button onclick="switchTab('crepes')" id="tab-crepes" class="tab-btn px-3 py-2 rounded bg-white border whitespace-nowrap">🌮 كريبات</button>
                    <button onclick="switchTab('meals')" id="tab-meals" class="tab-btn px-3 py-2 rounded bg-white border whitespace-nowrap">🍱 وجبات</button>
                    <button onclick="switchTab('pizza_italy')" id="tab-pizza_italy" class="tab-btn px-3 py-2 rounded bg-white border whitespace-nowrap">🍕 بيتزا إيطالي</button>
                    <button onclick="switchTab('pizza_oriental')" id="tab-pizza_oriental" class="tab-btn px-3 py-2 rounded bg-white border whitespace-nowrap">🥘 بيتزا شرقي</button>
                    <button onclick="switchTab('fateer_salty')" id="tab-fateer_salty" class="tab-btn px-3 py-2 rounded bg-white border whitespace-nowrap">🫓 فطير حادق</button>
                    <button onclick="switchTab('fateer_sweet')" id="tab-fateer_sweet" class="tab-btn px-3 py-2 rounded bg-white border whitespace-nowrap">🍯 فطير حلو</button>
                </div>

                <!-- شبكة أصناف القسم المختار -->
                <div id="itemsGrid" class="grid grid-cols-2 sm:grid-cols-3 gap-2 max-h-[450px] overflow-y-auto p-1">
                    <!-- تتغير تلقائياً حسب القسم -->
                </div>
            </div>

            <!-- قسم تفاصيل الطلب والفاتورة (5 أعمدة) -->
            <div class="lg:col-span-5 bg-gray-50 p-3 rounded border flex flex-col justify-between">
                <div>
                    <h2 class="text-lg font-bold mb-2 text-gray-800 border-b pb-1">تفاصيل الأوردر الحالى</h2>
                    <input type="text" id="customerName" placeholder="اسم العميل / رقم الطاولة" class="w-full p-2 border rounded mb-2 text-sm">
                    
                    <div id="cartItems" class="bg-white p-2 border rounded mb-2 min-h-[160px] max-h-[220px] overflow-y-auto text-sm">
                        <span class="text-gray-400">اختر الأصناف من القائمة...</span>
                    </div>
                </div>

                <div>
                    <div class="flex justify-between items-center mb-3 bg-red-50 p-2 rounded border border-red-200 font-bold text-lg">
                        <span>إجمالي الحساب:</span>
                        <span id="cartTotal" class="text-red-700">0 جنيه</span>
                    </div>

                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="submitOrder()" class="bg-green-600 text-white p-2.5 rounded font-bold hover:bg-green-700 text-sm">حفظ وطباعة الريسيت 🖨️</button>
                        <button onclick="clearCart()" class="bg-gray-400 text-white p-2.5 rounded font-bold hover:bg-gray-500 text-sm">إلغاء الأوردر</button>
                    </div>
                </div>
            </div>

        </div>

        <!-- قائمة الطلبات المسجلة -->
        <div class="mt-4 bg-gray-50 p-3 rounded border">
            <h2 class="text-md font-bold mb-2 text-gray-800">آخر الطلبات المسجلة</h2>
            <div id="ordersList" class="space-y-2 max-h-[200px] overflow-y-auto">
                <p class="text-gray-500 text-sm">جاري التحميل...</p>
            </div>
        </div>
    </div>

    <!-- نافذة تقرير المبيعات -->
    <div id="salesModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center p-4">
        <div class="bg-white p-6 rounded-lg max-w-md w-full shadow-lg">
            <h2 class="text-xl font-bold mb-4 text-gray-800">📊 تقرير مبيعات اليوم</h2>
            <p id="salesReportText" class="text-lg mb-6 text-gray-700">جاري الحساب...</p>
            <button onclick="closeSalesReport()" class="w-full bg-blue-600 text-white p-2 rounded font-bold">إغلاق</button>
        </div>
    </div>

    <!-- منطقة الطباعة المزدوجة (ريسيت العميل + بون المطبخ) -->
    <div id="printArea" class="hidden font-sans p-2">
        <!-- ريسيت العميل -->
        <div style="page-break-after: always; text-align: center; border-bottom: 2px dashed #000; padding-bottom: 20px;">
            <h2 style="font-size: 20px; font-weight: bold;">مطعم كبده ومخ الشرقاوي</h2>
            <p style="font-size: 12px;" id="pCustomerMeta"></p>
            <hr style="margin: 10px 0;">
            <div id="pCustomerItems" style="text-align: right; font-size: 13px;"></div>
            <hr style="margin: 10px 0;">
            <h3 style="font-size: 16px; font-weight: bold;" id="pCustomerTotal"></h3>
            <p style="font-size: 10px; margin-top: 10px;">شكراً لزيارتكم الشرقاوي 🥩</p>
        </div>

        <!-- بون المطبخ -->
